<div data-screen-label="External Stimuli" style="height:100vh;width:100vw;background:transparent;color:#e6dcc4;font-family:'Fragment Mono',monospace;display:flex;">

  <section style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:#0b0908;border:1px solid rgba(233,217,187,.09);">
    <div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid rgba(233,217,187,.07);">
      <span style="width:4px;height:4px;border-radius:50%;background:rgba(230,220,200,.35);"></span>
      <span style="font-family:'Marcellus',serif;font-size:10px;letter-spacing:.38em;color:rgba(236,226,204,.55);">EXTERNAL STIMULI</span>
      <span style="margin-left:auto;font-size:9px;letter-spacing:.14em;color:#8a7457;">1 Hz POLL</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;flex:1;min-height:0;">
      <div style="padding:9px 12px;border-right:1px solid rgba(233,217,187,.07);border-bottom:1px solid rgba(233,217,187,.07);display:flex;align-items:baseline;gap:6px;"><span style="font-size:8px;letter-spacing:.12em;color:#8a7457;flex:1;">AIR TEMP</span><span style="font-size:12px;color:#cfc2a6;">{{ tempF }}°F</span></div>
      <div style="padding:9px 12px;border-bottom:1px solid rgba(233,217,187,.07);display:flex;align-items:baseline;gap:6px;"><span style="font-size:8px;letter-spacing:.12em;color:#8a7457;flex:1;">HUMIDITY</span><span style="font-size:12px;color:#cfc2a6;">{{ humidity }}%</span></div>
      <div style="padding:9px 12px;border-right:1px solid rgba(233,217,187,.07);border-bottom:1px solid rgba(233,217,187,.07);display:flex;align-items:baseline;gap:6px;"><span style="font-size:8px;letter-spacing:.12em;color:#8a7457;flex:1;">WIND</span><span style="font-size:12px;color:#c2b294;">{{ wind }} S</span></div>
      <div style="padding:9px 12px;border-bottom:1px solid rgba(233,217,187,.07);display:flex;align-items:baseline;gap:6px;"><span style="font-size:8px;letter-spacing:.12em;color:#8a7457;flex:1;">SOLAR</span><span style="font-size:12px;color:#cfc2a6;">{{ solar }}</span></div>
      <div style="padding:9px 12px;border-right:1px solid rgba(233,217,187,.07);border-bottom:1px solid rgba(233,217,187,.07);display:flex;align-items:baseline;gap:6px;"><span style="font-size:8px;letter-spacing:.12em;color:#8a7457;flex:1;">AIR QUALITY</span><span style="font-size:12px;color:#d8cbb0;">{{ aqi }} MOD</span></div>
      <div style="padding:9px 12px;border-bottom:1px solid rgba(233,217,187,.07);display:flex;align-items:baseline;gap:6px;"><span style="font-size:8px;letter-spacing:.12em;color:#8a7457;flex:1;">BAROMETER</span><span style="font-size:12px;color:#c2b294;">{{ baro }} ↘</span></div>
      <div style="padding:9px 12px;border-right:1px solid rgba(233,217,187,.07);display:flex;align-items:baseline;gap:6px;"><span style="font-size:8px;letter-spacing:.12em;color:#8a7457;flex:1;">MAGNETIC</span><span style="font-size:12px;color:#c2b294;">{{ mag }} µT</span></div>
      <div style="padding:9px 12px;display:flex;align-items:baseline;gap:6px;"><span style="font-size:8px;letter-spacing:.12em;color:#8a7457;flex:1;">ELEVATION</span><span style="font-size:12px;color:#d8cbb0;">{{ elev }} ft</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid rgba(233,217,187,.07);">
      <span style="font-size:8px;letter-spacing:.14em;color:#8a7457;">SUN POSITION</span>
      <span style="margin-left:auto;font-size:10px;letter-spacing:.12em;color:#d8cbb0;border:1px solid #2c2013;padding:3px 9px;">✓ {{ sunPos }}</span>
    </div>
  </section>
</div>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tick: 0 };

  componentDidMount() {
    this.t0 = performance.now();
    this.sensors = { tempF: 96.2, humidity: 43, wind: 11.5, solar: 912, aqi: 52, baro: 1011.8, mag: 47.1, elev: 652 };
    this.tickInterval = setInterval(() => {
      this.simSensors();
      this.setState(s => ({ tick: s.tick + 1 }));
    }, 500);
  }

  componentWillUnmount() { clearInterval(this.tickInterval); }

  simSensors() {
    const t = (performance.now() - this.t0) / 1000;
    const n = (f, ph) => Math.sin(t * f + ph) + 0.5 * Math.sin(t * f * 2.7 + ph * 2);
    const S = this.sensors;
    S.tempF = 96.2 + n(0.018, 1) * 1.4;
    S.humidity = 43 + n(0.02, 4) * 3;
    S.wind = Math.max(3, 11.5 + n(0.09, 2) * 4.2);
    S.solar = Math.max(680, 905 + n(0.05, 7) * 90);
    S.baro = 1011.6 + n(0.006, 3) * 1.2;
    S.mag = 47.1 + n(0.11, 5) * 0.5;
    S.elev = 650 + n(0.01, 6) * 42;
    S.aqi = Math.round(52 + n(0.008, 1) * 5);
  }

  renderVals() {
    const S = this.sensors || { tempF: 96, humidity: 43, wind: 11, solar: 905, aqi: 52, baro: 1011.6, mag: 47.1, elev: 652 };
    return {
      tempF: S.tempF.toFixed(1),
      humidity: Math.round(S.humidity),
      wind: S.wind.toFixed(1),
      solar: Math.round(S.solar),
      aqi: S.aqi,
      baro: S.baro.toFixed(1),
      mag: S.mag.toFixed(1),
      elev: Math.round(S.elev),
      sunPos: 'SOUTHWEST · 64° ALT',
    };
  }
}
</script>
